name: Release Shadowrocket Rules

permissions:
  contents: write
  
on:
  schedule:
    # 每日8时开始
    - cron:  '0 23 * * *'
  
  push:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:
  
jobs:
  Release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
          path: build

      - uses: actions/checkout@v4
        with:
          ref: release
          path: release
      
      - name: Fetch upstream
        run: |
          git clone --depth 1 --branch build \
            https://github.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever.git \
            upstream
          test -f upstream/factory/template/sr_cnip_ad.txt
          test -f upstream/factory/auto_build.sh

      - name: Sync upstream and keep Zhihu rules
        run: |
          rsync -a --delete --exclude='.git/' upstream/ build/

          python3 - <<'PY'
          from pathlib import Path

          p = Path("build/factory/template/sr_cnip_ad.txt")
          text = p.read_text(encoding="utf-8")

          rules = [
              "AND,((DOMAIN,api.zhihu.com),(PROTOCOL,UDP)),REJECT-NO-DROP",
              r"URL-REGEX,^https?:\/\/api\.zhihu\.com\/commercial_api\/launch_v2\?,REJECT",
              r"URL-REGEX,^https?:\/\/api\.zhihu\.com\/commercial_api\/real_time_launch_v2\?,REJECT",
          ]

          anchor = "DOMAIN-SUFFIX,ampproject.org,PROXY # Google AMP issue#237"
          if anchor not in text:
              raise SystemExit("ERROR: 上游模板结构已变化，停止构建，避免错误发布")

          for rule in rules:
              if rule not in text:
                  text = text.replace(anchor, anchor + "\n" + rule, 1)
                  anchor = rule

          p.write_text(text, encoding="utf-8")
          print("已确认三条知乎规则均在模板中")
          for rule in rules:
              if rule not in text:
                  raise SystemExit("ERROR: 知乎规则检查失败")
          PY

      - name: Install requirements
        run: pip3 install -r build/requirements.txt

      - name: Build Rules
        run: |
          cd build || exit 1
          ./factory/auto_build.sh

      
      - name: Verify and push build branch
        run: |
          cd build || exit 1

          FILE="sr_cnip_ad.conf"
          test -f "$FILE" || {
            echo "ERROR: 未生成 sr_cnip_ad.conf"
            exit 1
          }

          grep -Fq 'AND,((DOMAIN,api.zhihu.com),(PROTOCOL,UDP)),REJECT-NO-DROP' "$FILE" || exit 1
          grep -Fq 'URL-REGEX,^https?:\/\/api\.zhihu\.com\/commercial_api\/launch_v2\?,REJECT' "$FILE" || exit 1
          grep -Fq 'URL-REGEX,^https?:\/\/api\.zhihu\.com\/commercial_api\/real_time_launch_v2\?,REJECT' "$FILE" || exit 1

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream and preserve Zhihu ad rules"
            git push origin HEAD:build
          else
            echo "没有文件变化，无需推送"
          fi

      - name: Move files
        run: |
          cd build || exit 1
          cp *.conf ../release/
          cp -r figure ../release/
          cp LICENSE ../release/
          cp readme.md ../release/
      
      - name: Update lazy rules
        run: |
          cd release || exit 1
          rm lazy.conf lazy_group.conf
          curl -O https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf
          curl -O https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy_group.conf
        
      - name: Remove commits
        run: |
          cd release || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan latest_branch
          git add -A
          git commit -am "Nightly build"
          git branch -D release
          git branch -m release
          git push -f origin release
